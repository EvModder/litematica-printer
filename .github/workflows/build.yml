# Build the project for every push and submitted pull request. Each build is
# kept as a 90-day artifact, and pushes to the default branch also refresh a
# rolling "latest development build" release.

name: Build

on: [ push, pull_request, workflow_dispatch ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        run: ./gradlew build

      - name: Upload commit artifact
        uses: actions/upload-artifact@v7
        with:
          name: litematica-printer-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          archive: false

      - name: Update latest development release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest-build
        run: |
          mcver=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          cp "build/libs/"*"+mc${mcver}.jar" "litematica-printer-latest-mc${mcver}.jar"
          notes="Built from [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) by [GitHub Actions](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."

          if previous=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null); then
            # Never let a re-run of an older commit replace a newer published build.
            if [[ $(gh api "repos/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_SHA}" --jq '.status') == behind ]]; then
              echo "A newer build is already published; leaving it unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Latest development build' --notes "$notes" --prerelease --latest=false
          fi

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release upload "$RELEASE_TAG" litematica-printer-latest-mc*.jar --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title 'Latest development build' --notes "$notes" --prerelease --latest=false
